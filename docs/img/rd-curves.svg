<title id="t">Rate-distortion curves: mipple vs bc7enc_rdo</title>
<desc id="d">Per format, Zstd-19 bits per texel against PSNR for mipple's λ sweep and bc7enc_rdo's strongest mode on the Kodak images.</desc>
